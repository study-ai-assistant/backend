name: CI
on:
  push:
    branches: [main, 'feature/**', 'chore/**', 'docs/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode checkstyle:check
  tests:
    name: tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
  docker:
    name: docker
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start without LLM secrets
        run: |
          cp .env.example .env
          docker compose up --build --wait --wait-timeout 180
          curl --fail --retry 5 --retry-delay 2 http://localhost:8080/health
          curl --fail http://localhost:8080/api/v1/modes
          docker compose exec -T backend sh -c 'test ! -e /app/.env'
      - name: Stop containers
        if: always()
        run: docker compose down
