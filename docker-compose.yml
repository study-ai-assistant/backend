services:
  backend:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_PORT: "8080"
      LLM_PROVIDER: "${LLM_PROVIDER:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      PDF_MAX_PAGES: "${PDF_MAX_PAGES:-50}"
      PDF_TIMEOUT: "${PDF_TIMEOUT:-10s}"
      PDF_MAX_CONCURRENT: "${PDF_MAX_CONCURRENT:-2}"
      PDF_WORKER_HEAP_MB: "${PDF_WORKER_HEAP_MB:-128}"
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "HealthCheck"]
      interval: 10s
      timeout: 8s
      start_period: 30s
      retries: 5
