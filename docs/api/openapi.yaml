openapi: 3.0.3
info:
  title: Study Assistant Backend
  version: 0.0.1
  description: Скелет API. Извлечение текста и вызов LLM пока не реализованы.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Проверить доступность сервера
      operationId: health
      responses:
        '200':
          description: Сервер работает; ключ LLM не требуется
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
  /actuator/health:
    get:
      responses:
        '200':
          description: Сервер работает
  /api/v1/modes:
    get:
      responses:
        '200':
          description: Режимы обработки
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessingMode'
  /api/v1/materials/process:
    post:
      description: Заглушка; непустые файлы пока приводят к ответу 501.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files, mode]
              properties:
                files:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: binary
                mode:
                  $ref: '#/components/schemas/ProcessingMode'
      responses:
        '200':
          description: Зарезервировано для будущей реализации
          content:
            application/json:
              schema:
                type: object
                required: [mode, result]
                properties:
                  mode:
                    $ref: '#/components/schemas/ProcessingMode'
                  result:
                    type: string
        '400':
          description: Неверный режим, отсутствующее поле или пустой файл
        '413':
          description: Превышен лимит 10 MB на файл или 30 MB на запрос
        '501':
          description: Обработка пока не реализована (Problem Details)
components:
  schemas:
    ProcessingMode:
      type: string
      enum: [SHORT_SUMMARY, DETAILED_SUMMARY, SIMPLE_EXPLANATION, SELF_CHECK_QUESTIONS, KEY_TERMS]
