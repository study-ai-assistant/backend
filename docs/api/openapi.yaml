openapi: 3.0.3
info:
  title: ИИ-помощник для учёбы — API
  version: 0.1.0
  description: |
    Реализованный API текста; изменения контракта согласовываются с mobile (задача #4).
    GET /health и GET /api/v1/modes реализованы.
    POST /api/v1/text/process реализован в задаче #8 для режима SHORT_SUMMARY.
    Загрузка файлов относится к следующему спринту и в этот контракт не входит.
servers:
  - url: http://localhost:8080
    description: Локальный сервер
paths:
  /health:
    get:
      operationId: health
      summary: Проверить доступность сервера
      responses:
        '200':
          description: Сервер работает без ключа LLM
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
  /api/v1/modes:
    get:
      operationId: listModes
      summary: Все идентификаторы режимов; не означает готовность их обработки
      responses:
        '200':
          description: Пять режимов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessingMode'
              example: [SHORT_SUMMARY, DETAILED_SUMMARY, SIMPLE_EXPLANATION, SELF_CHECK_QUESTIONS, KEY_TERMS]
  /api/v1/text/process:
    post:
      operationId: processText
      summary: Обработать учебный текст
      description: |
        Синхронный запрос, UTF-8. Поддерживается SHORT_SUMMARY;
        остальные режимы возвращают 400.
        Запрос содержит ровно два поля text и mode; дополнительные поля не принимаются.
        Переносы строк внутри text кодируются как \n; JSON формируется сериализатором.
        Для генерации серверу нужны настройки Groq и действующий ключ.
        text содержит от 1 до 10000 Unicode-символов и хотя бы один непробельный символ.
        Лимит применяется к декодированному text, не к размеру JSON в байтах.
        Отдельная предварительная проверка токенного бюджета пока не реализована.
        Ошибки провайдера, включая превышение его лимитов, возвращаются как 502.
        Клиенту рекомендуется таймаут 90 секунд; ожидание результата LLM ограничено 60 секундами.
        Автоматический повтор POST не гарантирует отсутствие повторной обработки.
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessTextRequest'
            example:
              text: Митохондрии обеспечивают клетку энергией в процессе клеточного дыхания.
              mode: SHORT_SUMMARY
      responses:
        '200':
          description: Результат обработки в виде обычного текста, без HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessTextResponse'
              example:
                mode: SHORT_SUMMARY
                result: Митохондрии обеспечивают клетку энергией.
        '400':
          description: Пустой текст, отсутствующее или лишнее поле, неверный тип данных, неверный JSON или неподдерживаемый режим
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                emptyText:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Текст не должен быть пустым.
                    instance: /api/v1/text/process
                invalidMode:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: В текущей версии поддерживается только SHORT_SUMMARY.
                    instance: /api/v1/text/process
        '413':
          description: Текст превышает 10000 Unicode-символов
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Payload Too Large
                status: 413
                detail: Максимальная длина текста — 10000 символов.
                instance: /api/v1/text/process
        '415':
          description: Content-Type должен быть application/json; ошибка обрабатывается Spring
        '502':
          description: Ошибка, таймаут или исчерпание квоты внешнего LLM; без внутренних данных провайдера
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Gateway
                status: 502
                detail: Сервис обработки текста временно недоступен. Повторите запрос позже.
                instance: /api/v1/text/process
  /actuator/health:
    get:
      operationId: actuatorHealth
      summary: Техническая проверка Spring Boot
      responses:
        '200':
          description: Сервер работает
  /api/v1/materials/process:
    post:
      operationId: uploadMaterialsStub
      summary: Заглушка загрузки файлов; обработка документов не реализована
      x-implementation-status: stub
      description: |
        Этот маршрут технически принимает multipart-загрузку, но непустые файлы
        всегда дают 501. TXT, PDF, DOCX не разбираются и не передаются в LLM.
        Ограничения загрузки 10 MB на файл и 30 MB на запрос.
        Для рабочей обработки используйте JSON с готовым текстом на /api/v1/text/process.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files, mode]
              properties:
                files:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: binary
                mode:
                  $ref: '#/components/schemas/ProcessingMode'
      responses:
        '400':
          description: Пустой файл, отсутствующее поле или неверный идентификатор режима
        '413':
          description: Превышен лимит multipart-загрузки
        '501':
          description: Обработка файлов ещё не реализована
components:
  schemas:
    ProcessingMode:
      type: string
      enum: [SHORT_SUMMARY, DETAILED_SUMMARY, SIMPLE_EXPLANATION, SELF_CHECK_QUESTIONS, KEY_TERMS]
    ProcessTextRequest:
      type: object
      additionalProperties: false
      required: [text, mode]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: '\S'
        mode:
          $ref: '#/components/schemas/ProcessingMode'
    ProcessTextResponse:
      type: object
      additionalProperties: false
      required: [mode, result]
      properties:
        mode:
          $ref: '#/components/schemas/ProcessingMode'
        result:
          type: string
          minLength: 1
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
