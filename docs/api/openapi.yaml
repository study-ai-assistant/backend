components:
  schemas:
    ProcessingMode:
      type: string
      enum: [SHORT_SUMMARY, DETAILED_SUMMARY, SIMPLE_EXPLANATION, SELF_CHECK_QUESTIONS, KEY_TERMS]
    ProcessTextRequest:
      type: object
      additionalProperties: false
      required: [text, mode]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: '\S'
        mode:
          $ref: '#/components/schemas/ProcessingMode'
    ProcessTextResponse:
      type: object
      additionalProperties: false
      required: [mode, result]
      properties:
        mode:
          $ref: '#/components/schemas/ProcessingMode'
        result:
          type: string
          minLength: 1
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string