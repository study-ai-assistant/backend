openapi: 3.1.1
info:
  title: ИИ-помощник для учёбы — API
  version: 0.0.1
  description: |
    Контракт API между мобильным приложением и сервером.
    Статус: ЧЕРНОВИК, эндпоинты будут добавлены в Спринте 1.

    Пользователь загружает учебный материал, сервер обрабатывает его с помощью
    внешнего LLM API и возвращает результат в одном из режимов:

    1. Краткий конспект.
    2. Подробный конспект.
    3. Объяснение простыми словами.
    4. Генерация вопросов для самопроверки.
    5. Выделение ключевых терминов.

    Идентификаторы режимов и форматы ответов — ЗАПОЛНИТЬ при согласовании контракта.
servers:
  - url: http://localhost:8080
    description: Локальный сервер разработчика (порт уточнить после выбора стека)
paths: {}
