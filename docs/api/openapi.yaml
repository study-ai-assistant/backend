                title: Bad Gateway
                status: 502
                detail: Сервис обработки текста временно недоступен. Повторите запрос позже.
                instance: /api/v1/materials/process
        '504':
          description: Превышен таймаут обработки PDF (10 секунд)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Gateway Timeout
                status: 504
                detail: Превышено время обработки файла. Попробуйте файл меньшего размера или сложности.
