openapi: 3.0.3
info:
  title: ИИ-помощник для учёбы — API
  version: 0.1.0
  description: |
    Черновик для согласования с mobile (задача #4).
    GET /health и GET /api/v1/modes реализованы.
    POST /api/v1/text/process реализован в задаче #8;
    поддержка всех пяти режимов добавлена в задаче #18.
    Примеры результатов иллюстративные; формулировки LLM могут отличаться.
    Загрузка файлов относится к следующему спринту и в этот контракт не входит.
servers:
  - url: http://localhost:8080
    description: Локальный сервер
paths:
  /health:
    get:
      operationId: health
      summary: Проверить доступность сервера
      responses:
        '200':
          description: Сервер работает без ключа LLM
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
  /api/v1/modes:
    get:
      operationId: listModes
      summary: Все поддерживаемые режимы обработки текста
      responses:
        '200':
          description: Пять режимов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessingMode'
              example: [SHORT_SUMMARY, DETAILED_SUMMARY, SIMPLE_EXPLANATION, SELF_CHECK_QUESTIONS, KEY_TERMS]
  /api/v1/text/process:
    post:
      operationId: processText
      summary: Обработать учебный текст
      description: |
        Синхронный запрос, UTF-8. Поддерживаются все пять режимов:
        SHORT_SUMMARY, DETAILED_SUMMARY, SIMPLE_EXPLANATION,
        SELF_CHECK_QUESTIONS, KEY_TERMS.
        Результат возвращается на русском языке обычным текстом
        в поле result, без HTML, Markdown и служебной разметки модели.
        text содержит от 1 до 10000 Unicode-символов и хотя бы один непробельный символ.
        Лимит применяется к декодированному text, не к размеру JSON в байтах.
        Отдельная предварительная проверка токенного бюджета пока не реализована.
        Ошибки провайдера, включая превышение его лимитов, возвращаются как 502.
        Клиенту рекомендуется таймаут 90 секунд; ожидание результата LLM ограничено 60 секундами.
        Автоматический повтор POST не гарантирует отсутствие повторной обработки.
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessTextRequest'
            example:
              text: Митохондрии обеспечивают клетку энергией в процессе клеточного дыхания.
              mode: SHORT_SUMMARY
      responses:
        '200':
          description: Результат обработки на русском языке обычным текстом, без HTML и служебной разметки модели
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessTextResponse'
              examples:
                shortSummary:
                  summary: Краткий конспект
                  value:
                    mode: SHORT_SUMMARY
                    result: Митохондрии обеспечивают клетку энергией.
                detailedSummary:
                  summary: Подробный конспект
                  value:
                    mode: DETAILED_SUMMARY
                    result: |
                      Митохондрии обеспечивают клетку энергией.
                      Это происходит в процессе клеточного дыхания.
                simpleExplanation:
                  summary: Объяснение простыми словами
                  value:
                    mode: SIMPLE_EXPLANATION
                    result: |
                      Митохондрии помогают клетке получать энергию в процессе клеточного дыхания.
                      По аналогии их можно представить как небольшие электростанции внутри клетки.
                selfCheckQuestions:
                  summary: Вопросы для самопроверки
                  value:
                    mode: SELF_CHECK_QUESTIONS
                    result: |
                      Что обеспечивает клетку энергией?
                      В процессе чего митохондрии обеспечивают клетку энергией?
                keyTerms:
                  summary: Ключевые термины
                  value:
                    mode: KEY_TERMS
                    result: |
                      Митохондрии — структуры, обеспечивающие клетку энергией.
                      Клеточное дыхание — процесс, в ходе которого митохондрии обеспечивают клетку энергией.
        '400':
          description: Пустой текст, отсутствующее или лишнее поле, неверный тип данных, неверный JSON или неподдерживаемый режим
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                emptyText:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Текст не должен быть пустым.
                    instance: /api/v1/text/process
                invalidMode:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Неподдерживаемый режим обработки.
                    instance: /api/v1/text/process
        '413':
          description: Текст превышает 10000 Unicode-символов
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Payload Too Large
                status: 413
                detail: Максимальная длина текста — 10000 символов.
                instance: /api/v1/text/process
        '502':
          description: Ошибка, таймаут или исчерпание квоты внешнего LLM; без внутренних данных провайдера
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Gateway
                status: 502
                detail: Сервис обработки текста временно недоступен. Повторите запрос позже.
                instance: /api/v1/text/process
components:
  schemas:
    ProcessingMode:
      type: string
      enum: [SHORT_SUMMARY, DETAILED_SUMMARY, SIMPLE_EXPLANATION, SELF_CHECK_QUESTIONS, KEY_TERMS]
    ProcessTextRequest:
      type: object
      additionalProperties: false
      required: [text, mode]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: '\S'
        mode:
          $ref: '#/components/schemas/ProcessingMode'
    ProcessTextResponse:
      type: object
      additionalProperties: false
      required: [mode, result]
      properties:
        mode:
          $ref: '#/components/schemas/ProcessingMode'
        result:
          type: string
          minLength: 1
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string