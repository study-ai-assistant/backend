spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${APP_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
# Для обработки текста нужны настройки Groq; /health работает без ключа.
app:
  pdf:
    max-pages: ${PDF_MAX_PAGES:50}
    timeout: ${PDF_TIMEOUT:10s}
    max-concurrent: ${PDF_MAX_CONCURRENT:2}
    worker-heap-mb: ${PDF_WORKER_HEAP_MB:128}
    temp-directory: ${PDF_TEMP_DIRECTORY:${java.io.tmpdir}}
  llm:
    provider: ${LLM_PROVIDER:}
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:}
    model: ${LLM_MODEL:}
